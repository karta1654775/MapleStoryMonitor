name: Warframe 更新日誌監控

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: warframe-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      DISCORD_WARFRAME_WEBHOOK: ${{ secrets.DISCORD_WARFRAME_WEBHOOK }}
      # 如果你的 RSS 網址跟程式裡的預設值不同，在這裡建一個 Variable 覆蓋，
      # 不要直接改 warframe_monitor.py。
      WARFRAME_RSS_URL: ${{ vars.WARFRAME_RSS_URL }}

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 快取 Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Playwright Chromium
        run: python -m playwright install chromium

      - name: 檢查必要 Secrets
        shell: bash
        run: |
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY: OK" || { echo "GEMINI_API_KEY: MISSING"; exit 1; }
          test -n "$DISCORD_WARFRAME_WEBHOOK" && echo "DISCORD_WARFRAME_WEBHOOK: OK" || { echo "DISCORD_WARFRAME_WEBHOOK: MISSING"; exit 1; }

      - name: 執行更新日誌監控
        shell: bash
        run: python warframe_monitor.py --scan-once

      - name: 儲存 warframe_seen.json
        shell: bash
        run: |
          if git diff --quiet -- warframe_seen.json; then
            echo "warframe_seen.json 沒有變更，不需要 commit。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warframe_seen.json
          git commit -m "chore: update Warframe seen state"
          git push
