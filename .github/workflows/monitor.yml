name: MapleStory 公告監控

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "選擇執行模式"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - simulate
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: maplestory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
      DISCORD_SHOP_WEBHOOK: ${{ secrets.DISCORD_SHOP_WEBHOOK }}
      DISCORD_MAINTENANCE_WEBHOOK: ${{ secrets.DISCORD_MAINTENANCE_WEBHOOK }}
      MAPLE_BROWSER: chromium
      MAPLE_URL: https://maplestory.beanfun.com/Main
      POLL_SECONDS: "300"
      MAX_NEW_PER_RUN: "10"
      API_SCAN_PAGES: "2"
      GENERAL_KEYWORDS: 職業,活動,燃燒
      SHOP_KEYWORDS: 商城
      MAINT_KEYWORDS: 維護,更新
      RUN_MODE: ${{ inputs.mode || 'normal' }}

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: 檢查必要 Secrets
        shell: bash
        run: |
          echo "執行模式：$RUN_MODE"
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY: OK" || { echo "GEMINI_API_KEY: MISSING"; exit 1; }
          test -n "$DISCORD_GENERAL_WEBHOOK" && echo "DISCORD_GENERAL_WEBHOOK: OK" || { echo "DISCORD_GENERAL_WEBHOOK: MISSING"; exit 1; }
          test -n "$DISCORD_SHOP_WEBHOOK" && echo "DISCORD_SHOP_WEBHOOK: OK" || { echo "DISCORD_SHOP_WEBHOOK: MISSING"; exit 1; }
          test -n "$DISCORD_MAINTENANCE_WEBHOOK" && echo "DISCORD_MAINTENANCE_WEBHOOK: OK" || { echo "DISCORD_MAINTENANCE_WEBHOOK: MISSING"; exit 1; }

      - name: 執行公告監控
        shell: bash
        run: |
          if [ "$RUN_MODE" = "simulate" ]; then
            echo "=== 模擬模式：抓目前實際公告並送 Discord，不修改 seen.json ==="
            python monitor.py --simulate
          else
            echo "=== 正常模式：只處理尚未通知的新公告 ==="
            python monitor.py --scan-once
          fi

      - name: 儲存 seen.json
        shell: bash
        run: |
          if [ "$RUN_MODE" = "simulate" ]; then
            echo "模擬模式：不提交 seen.json。"
            exit 0
          fi

          if git diff --quiet -- seen.json; then
            echo "seen.json 沒有變更，不需要 commit。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update MapleStory seen state"
          git push

