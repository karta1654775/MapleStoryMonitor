name: Warframe 更新日誌監控

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "選擇執行模式"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - simulate
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: warframe-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      DISCORD_WARFRAME_WEBHOOK: ${{ secrets.DISCORD_WARFRAME_WEBHOOK }}
      # 如果你的 RSS 網址跟程式裡的預設值不同，在這裡建一個 Variable 覆蓋，
      # 不要直接改 warframe_monitor.py。
      WARFRAME_RSS_URL: ${{ vars.WARFRAME_RSS_URL }}
      RUN_MODE: ${{ inputs.mode || 'normal' }}

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 檢查必要 Secrets
        shell: bash
        run: |
          echo "執行模式：$RUN_MODE"
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY: OK" || { echo "GEMINI_API_KEY: MISSING"; exit 1; }
          test -n "$DISCORD_WARFRAME_WEBHOOK" && echo "DISCORD_WARFRAME_WEBHOOK: OK" || { echo "DISCORD_WARFRAME_WEBHOOK: MISSING"; exit 1; }

      - name: 執行更新日誌監控
        shell: bash
        run: |
          if [ "$RUN_MODE" = "simulate" ]; then
            echo "=== 模擬模式：抓取最新一篇更新日誌並送 Discord，不修改 seen.json ==="
            python warframe_monitor.py --simulate
          else
            echo "=== 正常模式：只處理尚未通知的新更新日誌 ==="
            python warframe_monitor.py --scan-once
          fi

      - name: 儲存 warframe_seen.json
        shell: bash
        run: |
          if [ "$RUN_MODE" = "simulate" ]; then
            echo "模擬模式：不提交 warframe_seen.json。"
            exit 0
          fi

          if git diff --quiet -- warframe_seen.json; then
            echo "warframe_seen.json 沒有變更，不需要 commit。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warframe_seen.json
          git commit -m "chore: update Warframe seen state"
          git push
