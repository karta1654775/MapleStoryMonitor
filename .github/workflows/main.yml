name: MapleStory 公告監控

on:
  workflow_dispatch:
  schedule:
    # 每 10 分鐘執行一次；GitHub Actions 使用台北時區。
    - cron: "*/10 * * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: maplestory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
      DISCORD_SHOP_WEBHOOK: ${{ secrets.DISCORD_SHOP_WEBHOOK }}
      DISCORD_MAINTENANCE_WEBHOOK: ${{ secrets.DISCORD_MAINTENANCE_WEBHOOK }}
      MAPLE_BROWSER: chromium
      MAPLE_URL: https://maplestory.beanfun.com/Main
      POLL_SECONDS: "600"
      MAX_NEW_PER_RUN: "10"
      API_SCAN_PAGES: "2"
      GENERAL_KEYWORDS: 職業,活動,燃燒
      SHOP_KEYWORDS: 商城
      MAINT_KEYWORDS: 維護,更新

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 安裝 Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: 執行一次公告檢查
        run: python monitor.py --scan-once

      - name: 儲存 seen.json
        run: |
          if git diff --quiet -- seen.json; then
            echo "seen.json 沒有變更，不需要 commit。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update MapleStory seen state"
          git push
