name: VALORANT 公告監控

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - test-latest
          - test-13-06
      test_url:
        description: "指定測試 URL（mode=test-latest 時會忽略）"
        required: false
        type: string
        default: "https://playvalorant.com/zh-tw/news/game-updates/valorant-patch-notes-13-06/"
  schedule:
    - cron: "*/15 * * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: valorant-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      DISCORD_VALORANT_WEBHOOK: ${{ secrets.DISCORD_VALORANT_WEBHOOK }}
      VALORANT_LISTING_URL: https://playvalorant.com/zh-tw/news/tags/patch-notes/
      VALORANT_MAX_NEW_PER_RUN: "1"
      RUN_MODE: ${{ inputs.mode || 'normal' }}
      TEST_URL: ${{ inputs.test_url }}

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝 Python 套件
        run: python -m pip install -r requirements.txt

      - name: 檢查必要 Secrets
        shell: bash
        run: |
          echo "執行模式：$RUN_MODE"
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY: OK" || { echo "GEMINI_API_KEY: MISSING"; exit 1; }
          test -n "$DISCORD_VALORANT_WEBHOOK" && echo "DISCORD_VALORANT_WEBHOOK: OK" || { echo "DISCORD_VALORANT_WEBHOOK: MISSING"; exit 1; }

      - name: 執行 VALORANT 公告監控
        shell: bash
        run: |
          if [ "$RUN_MODE" = "test-latest" ]; then
            python valorant_monitor.py --test-latest
          elif [ "$RUN_MODE" = "test-13-06" ]; then
            python valorant_monitor.py --force-url "https://playvalorant.com/zh-tw/news/game-updates/valorant-patch-notes-13-06/"
          else
            python valorant_monitor.py --scan-once
          fi

      - name: 儲存 valorant_seen.json
        shell: bash
        run: |
          if [ "$RUN_MODE" != "normal" ]; then
            echo "測試模式：不提交 valorant_seen.json。"
            exit 0
          fi

          if git diff --quiet -- valorant_seen.json; then
            echo "valorant_seen.json 沒有變更，不需要 commit。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valorant_seen.json
          git commit -m "chore: update Valorant seen state"
          git push
